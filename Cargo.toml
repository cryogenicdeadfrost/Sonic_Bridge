[workspace]
members = ["client", "server", "shared", "ui"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["ABD <cryogenicdeadfrost>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16.0"
eframe = "0.37.0"
flexaudio = "0.8.1"
rusty-opus = "1.0"
chacha20poly1305 = "0.11.0"
rand = "0.10.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
